name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交密钥、openid、数据库导出或未经打码的后台截图。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么，预期行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 小程序版本
      placeholder: 例如 v2.0.0
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 微信版本、设备和系统版本
